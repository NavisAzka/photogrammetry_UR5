services:

  persepsi:
    build: .
    container_name: photogrametry_ui
    ports:
      - "12345:12345"
    volumes:
      - ./datasets:/app/datasets      # captured images
      - ./output:/app/output          # ODM reconstruction output
    devices:
      # Camera passthrough — set CAMERA_DEVICE in .env
      # Run: ls /dev/video* or v4l2-ctl --list-devices to find your device
      - "${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}"
    group_add:
      - video                         # grants access to /dev/video*
    environment:
      # NodeODM runs on the host machine
      - NODE_HOST=host.docker.internal
      - NODE_PORT=6969
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
